# Keeps the free Supabase database from pausing (it pauses after 7 days
# with no activity). Runs every 2 days through the holidays, then stops
# on its own. If a check ever fails, GitHub emails you automatically.
name: Keep gift exchange awake

on:
  schedule:
    - cron: "23 15 */2 * *"   # every other day, mid-morning Eastern
  workflow_dispatch:           # lets you run it by hand from the Actions tab

env:
  STOP_AFTER: "2027-01-06"     # last day to keep pinging (change if you like)

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the date
        id: when
        run: |
          if [[ "$(date -u +%F)" > "$STOP_AFTER" ]]; then
            echo "Past $STOP_AFTER, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ping the database
        if: steps.when.outputs.skip != 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_KEY under Settings > Secrets and variables > Actions"
            exit 1
          fi
          body=$(curl -sS --fail-with-body --retry 4 --retry-delay 20 --retry-all-errors --max-time 30 \
            -X POST "${SUPABASE_URL%/}/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}') || {
              echo "::error::Database didn't answer. If it says paused, open supabase.com and click Resume project."
              echo "$body"; exit 1; }
          echo "Database is awake: $body"
          echo "$body" | grep -q '"ok" *: *true'

      - name: Check the website loads
        if: steps.when.outputs.skip != 'true' && vars.SITE_URL != ''
        run: curl -sS --fail --retry 3 --retry-delay 15 --max-time 30 -o /dev/null "${{ vars.SITE_URL }}" && echo "Site is up"
